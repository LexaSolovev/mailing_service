{% extends 'base.html' %}

{% block content %}
<h1>Список сообщений</h1>
<table class="table">
    <thead>
        <tr>
            <th>Тема</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in messages %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>
                <a href="{% url 'my_messages:detail' message.pk %}" class="btn btn-info">Просмотр</a>
                <a href="{% url 'my_messages:update' message.pk %}" class="btn btn-warning">Редактировать</a>
                <a href="{% url 'my_messages:delete' message.pk %}" class="btn btn-danger">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'my_messages:create' %}" class="btn btn-primary">Создать сообщение</a>
{% endblock %}
