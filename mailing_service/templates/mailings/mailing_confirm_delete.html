{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Подтверждение удаления</h2>
    
    <div class="alert alert-danger">
        <p>Вы уверены, что хотите удалить рассылку #{{ mailing.id }}?</p>
        <p><strong>Сообщение:</strong> {{ mailing.message.subject }}</p>
        <p><strong>Клиентов:</strong> {{ mailing.clients.count }}</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailings:detail' mailing.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
