{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if object %}Редактирование{% else %}Создание{% endif %} рассылки</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="{{ form.start_time.id_for_label }}" class="form-label">Время начала</label>
            {{ form.start_time }}
        </div>
        
        <div class="mb-3">
            <label for="{{ form.end_time.id_for_label }}" class="form-label">Время окончания</label>
            {{ form.end_time }}
        </div>
        
        <div class="mb-3">
            <label for="{{ form.message.id_for_label }}" class="form-label">Сообщение</label>
            {{ form.message }}
        </div>
        
        <div class="mb-3">
            <label for="{{ form.clients.id_for_label }}" class="form-label">Клиенты</label>
            {{ form.clients }}
        </div>
        
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% if object %}{% url 'mailings:detail' object.id %}{% else %}{% url 'mailings:list' %}{% endif %}" 
           class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
