{% extends 'base.html' %}

{% block content %}
<h1>Список клиентов</h1>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        {% for client in clients %}
        <tr>
            <td>{{ client.id }}</td>
            <td>{{ client.full_name }}</td>  <!-- или другое поле с именем -->
            <td>{{ client.email }}</td>
            <td>
                <a href="{% url 'clients:update' client.id %}" class="btn btn-sm btn-warning">Редактировать</a>
                <a href="{% url 'clients:delete' client.id %}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center">Нет клиентов</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'clients:create' %}" class="btn btn-primary">Добавить клиента</a>
{% endblock %}
